name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"

# Third-party actions are pinned to full commit SHAs (supply-chain hardening).
jobs:
  checks:
    name: Lint, types, tests, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lockfile is current
        run: uv lock --check
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Types
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest
      - name: Contract drift
        run: uv run python scripts/export_contracts.py --check

  integration:
    name: Integration (local stack)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Start local stack
        run: docker compose -f deploy/docker-compose.dev.yml up -d --wait
      - name: Install
        run: uv sync --locked
      - name: Integration tests
        run: |
          cp .env.example .env
          uv run pytest -m integration
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml logs --no-color
      - name: Stop local stack
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v

  images:
    name: Build image (${{ matrix.target }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ai-http, ai-agent, ai-crawl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f deploy/Dockerfile --target ${{ matrix.target }} -t busmora-${{ matrix.target }}:ci .
